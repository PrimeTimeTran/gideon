[package]
name = "gideon"
description = "Gideon helps developers discover hidden patterns in code."
edition = "2024"
version = "0.0.1"
authors = ["Loi Tran"]
license = "MIT OR Apache-2.0"

documentation = "https://docs.rs/gideon"
homepage = "https://kb-blog-primetimetran.vercel.app/"
repository = "https://github.com/primetimetran/gideon"
keywords = ["virtualization","visualization","filesystem", "development-tools", "os"]
categories = ["virtualization","visualization","filesystem", "development-tools", "os"]

[dependencies]
cli = { path = "../cli" }
vfs = { path = "../vfs" }
clap = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }
colored = { workspace = true }
ratatui = { workspace = true }
schemars = { workspace = true }
textwrap = { workspace = true }
crossterm = { workspace = true }
serde_json = { workspace = true }
rmcp = { workspace = true }
jsonschema = { workspace = true }
async-trait = { workspace = true }
ratatui-textarea = { workspace = true }

uuid = {version = "1.23.3", features = ["v4"]}
reqwest = { version = "0.13.4", features = ["json", "blocking"] }

